<script>
/* Resource resolver — maps raw asset paths to inlined blob URLs when bundled,
   falls back to the raw path in the live (non-bundled) file. Derives the id
   directly from the filename so it survives the bundler stripping meta tags. */
window.R = function(p) {
  if (window.__resources) {
    var base = p.split('/').pop().replace(/\.[^.]+$/, '');
    var id = 'res_' + base.replace(/[^a-z0-9]/gi, '');
    if (window.__resources[id]) return window.__resources[id];
  }
  return p;
};
</script>

<script type="text/babel">
const { useEffect, useState } = React;

function FitRow({ items }) {
  const [scale, setScale] = useState(1);
  const totalW = items.reduce((s, i) => s + i.width, 0) + (items.length - 1) * 40;
  useEffect(() => {
    const recalc = () => {
      const max = Math.min(window.innerWidth - 120, 1700);
      setScale(Math.min(1, max / totalW));
    };
    recalc();
    window.addEventListener('resize', recalc);
    return () => window.removeEventListener('resize', recalc);
  }, [totalW]);
  return (
    <div style={{ display: 'flex', gap: 40 * scale, alignItems: 'flex-start' }}>
      {items.map((it, i) => (
        <div key={i} className="artboard-wrap" style={{ width: it.width * scale, height: it.height * scale, marginTop: 50 }}>
          <div className="artboard-label">{it.label}</div>
          <div className="artboard" style={{ width: it.width, height: it.height, transform: `scale(${scale})`, transformOrigin: 'top left' }}>{it.node}</div>
        </div>
      ))}
    </div>
  );
}

const PAGES = [
  { id: 'home', eye: 'Page 01', title: 'Home.', sub: 'Hero · Shop by toggle · This Season · Tool teaser · Notes · Gratitude.', d: <AtelierDesktopHome />, m: <AtelierMobileHome />, dh: 6760, mh: 4480 },
  { id: 'shop', eye: 'Page 02', title: 'The Shop.', sub: 'PLP with filter sidebar, editorial slot, and a load-more rail.', d: <AtelierPLP />, m: <AtelierPLPMobile />, dh: 3800, mh: 2580 },
  { id: 'product', eye: 'Page 03', title: 'Ruffle Urli.', sub: 'PDP — gallery, size & finish, the story, specifications, pairs with.', d: <AtelierPDP />, m: <AtelierPDPMobile />, dh: 4010, mh: 2760 },
  { id: 'studio', eye: 'Page 04', title: 'The Studio.', sub: 'About — manifesto, five things we believe, how we make, the studios.', d: <AtelierAbout />, m: <AtelierAboutMobile />, dh: 5430, mh: 2760 },
  { id: 'story', eye: 'Page 05', title: 'Field Note.', sub: 'Editorial — Moradabad, where the brass is folded by hand.', d: <AtelierEditorial />, m: <AtelierEditorialMobile />, dh: 4760, mh: 2860 },
  { id: 'bag', eye: 'Page 06', title: 'The Bag.', sub: 'Cart with milestone rewards, coupon code, estimated delivery, payment options.', d: <AtelierCart />, m: <AtelierCartMobile />, dh: 2920, mh: 2760 },
  { id: 'tool', eye: 'Page 07 · Phase 2', title: 'Complete the Look.', sub: 'Design Your Space — pick a styled scene, swap any piece, buy the whole look as a discounted bundle. Surface / Room toggle. Try the controls.', d: <AtelierTool />, m: <AtelierToolMobile />, dh: 2040, mh: 3260 },
];

function App() {
  return (
    <div>
      <div className="toc">
        <span className="brand">Elements of Decor · Atelier</span>
        {PAGES.map(p => <a key={p.id} href={'#' + p.id}>{p.title.replace('.', '').replace(' · Phase 2','')}</a>)}
      </div>

      {PAGES.map(p => (
        <React.Fragment key={p.id}>
          <div id={p.id} className="section-head">
            <div className="section-eye">{p.eye}</div>
            <div className="section-title">{p.title}</div>
            <div className="section-sub">{p.sub}</div>
          </div>
          <div className="stage">
            <FitRow items={[
              { label: 'Desktop · 1440', width: 1440, height: p.dh, node: p.d },
              { label: 'Mobile · 414', width: 440, height: p.mh, node: p.m },
            ]} />
          </div>
        </React.Fragment>
      ))}

      <div style={{ padding: '48px 80px 96px', textAlign: 'center', color: 'rgba(242,235,222,.4)', fontSize: 12, letterSpacing: '.2em', textTransform: 'uppercase' }}>
        — End of Atelier v1 ·  Six pages, desktop + mobile —
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
